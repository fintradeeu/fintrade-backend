# Render Blueprint — deploy backend + database in one click
# Usage: Push to GitHub, then go to https://render.com/deploy
# and paste your repo URL

databases:
  - name: fittrade-db
    plan: free
    databaseName: fittrade_lms
    user: fittrade_user



services:
  - type: web
    name: fittrade-backend
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fittrade-db
          property: connectionString
        # Render provides postgresql:// but we need postgresql+asyncpg://
        # We handle this transform in config.py
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "360"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: APP_NAME
        value: FItTrade LMS
      - key: APP_VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY
        value: ""
      - key: USE_MILVUS
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: thefintrade1993@gmail.com
      - key: SMTP_PASSWORD
        value: rggy danx ialr bata
      - key: EMAIL_FROM
        value: thefintrade1993@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_WORKSPACE_EMAIL
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
